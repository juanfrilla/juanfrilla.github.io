<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> · Juan Fran Martín</title>
    <meta name="description"
        content="Juan Fran Martín — Web scraping, web security, reverse engineering and JavaScript virtual machines.">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Prism.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <style>
        :root {
            --text: #1f2328;
            --muted: #656d76;
            --border: #d8dee4;
            --background: #ffffff;
            --surface: #f6f8fa;
            --accent: #0969da;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: var(--background);
            color: var(--text);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Helvetica,
                Arial,
                sans-serif;

            line-height: 1.6;
        }

        /* Navigation */

        nav {
            height: 64px;

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;

            padding: 0 24px;

            position: sticky;
            top: 0;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);

            z-index: 10;
        }

        .nav-container {
            width: 100%;
            max-width: 1000px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            font-weight: 600;

            color: var(--text);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        nav a {
            color: var(--muted);

            text-decoration: none;

            font-size: 14px;
        }

        nav a:hover {
            color: var(--text);
        }

        /* Main content */

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .home {
            text-align: center;
        }

        .home p {
            margin-left: auto;
            margin-right: auto;
        }

        .home .social-links {
            justify-content: center;
        }


        /* Typography */

        h1 {
            margin: 0 0 24px;

            font-size: clamp(38px, 6vw, 56px);

            line-height: 1.1;

            letter-spacing: -1.5px;

            color: var(--text);
        }

        h2 {
            margin-top: 56px;
            margin-bottom: 20px;

            font-size: 28px;

            letter-spacing: -0.5px;
        }

        h3 {
            margin-top: 36px;
        }

        p {
            max-width: 1000px;

            color: var(--muted);

            font-size: 17px;
        }

        a {
            color: var(--accent);
        }

        /* Social links */

        .social-links {
            display: flex;

            gap: 20px;

            margin-top: 30px;
        }

        .social-links a {
            color: var(--muted);

            font-size: 24px;

            text-decoration: none;

            transition: color 0.2s ease;
        }

        .social-links a:hover {
            color: var(--accent);
        }

        /* Code */

        code {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 6px;

            padding: 2px 6px;

            font-family:
                ui-monospace,
                SFMono-Regular,
                Menlo,
                Monaco,
                Consolas,
                monospace;

            font-size: 0.9em;
        }

        pre {
            background: #f6f8fa;

            border: 1px solid var(--border);

            border-radius: 8px;

            padding: 20px;

            overflow-x: auto;
        }

        pre code {
            background: none;

            border: 0;

            padding: 0;
        }

        /* Lists */

        ul,
        ol {
            color: var(--muted);
            padding-left: 0;
            list-style-position: inside;
        }

        li {
            margin: 6px 0;
        }

        /* Horizontal rule */

        hr {
            border: 0;

            border-top: 1px solid var(--border);

            margin: 48px 0;
        }

        /* Images */

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 24px auto;
        }

        .post-image {
            width: 100%;
            max-width: none;
        }

        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 0 16px;
            }

            main {
                padding: 56px 20px;
            }

            .nav-links {
                gap: 16px;
            }

            h1 {
                font-size: 40px;
            }

            p {
                max-width: 1000px;
                margin: 0 auto 16px;
                color: var(--muted);
                font-size: 17px;
            }

        }
    </style>

</head>

<body>

    <nav>

        <div class="nav-container">

            <a class="brand" href="/">
                Juan Fran Martín
            </a>

            <div class="nav-links">

                <a href="/">
                    Home
                </a>

                <a href="/blog/">
                    Blog
                </a>

            </div>

        </div>

    </nav>

    <main>

        <p>generate my cv and download pdf here and remove juanfran.streamlit.app</p>


    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

</body>

</html>
